[project]
name = "trajfoundry-prefix"
version = "0.1.0"
description = "Spark prefix deduplication of already normalized trajectories, preserving original records."
requires-python = ">=3.11"
dependencies = ["orjson>=3.10,<4", "boto3>=1.35,<2"]

[project.optional-dependencies]
spark = ["pyspark>=3.5,<3.6"]
test = ["pytest>=8,<10", "ruff>=0.12"]

[project.scripts]
trajectory-prefix = "trajectory_prefix.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trajectory_prefix"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

